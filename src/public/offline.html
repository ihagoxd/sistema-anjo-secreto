<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>Sem conexão · Anjo Secreto</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; object-fit: contain; opacity: 0.9; }
    h1 { font-size: 22px; margin: 18px 0 6px; }
    p { color: #8b949e; margin: 0 0 20px; max-width: 34ch; }
    button { font: inherit; font-weight: 600; background: #e3b341; color: #1f1500; border: none; border-radius: 999px; padding: 11px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <img src="/img/logo.png" alt="">
    <h1>Sem conexão</h1>
    <p>O Anjo Secreto precisa de internet para carregar esta tela. Assim que a conexão voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
